            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: var(--sat-color)">${total > 0 ? ((resolved/total)*100).toFixed(0) : 0}%</div>
                <div class="stat-label">Resolution Rate</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: var(--primary)">${total > 0 ? ((lowEffort/total)*100).toFixed(0) : 0}%</div>
                <div class="stat-label">Low Effort Rate</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${total > 0 ? (totalTurns/total).toFixed(1) : 0}</div>
                <div class="stat-label">Avg Turns / Conv</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: var(--quality-excellent)">${avgQuality}</div>
                <div class="stat-label">Avg Judge Score</div>
                <div class="stat-sublabel">From gemini_judge_response (1–5)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: var(--neu-color)">$ ${totalCost.toFixed(3)}</div>
                <div class="stat-label">Total Cost</div>
                <div class="stat-sublabel">gpt-5.1 + Gemini judge</div>
            </div>
        `;
        document.getElementById('statsGrid').innerHTML = statsHtml;
    }

    function renderTable(search = '') {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        const searchLower = search.toLowerCase();

        data.forEach((row, index) => {
            const metrics = row.analysis?.metrics || {};
            const outcome = metrics.outcome?.label || 'Unknown';
            const effort = metrics.effort_score || 'Unknown';
            const firstMsg = row.messages[0]?.content || '';
            const convId = row.conversation_id || 'Unknown';
            const qualityScore = row.judge && typeof row.judge.accuracy_score === 'number'
                ? row.judge.accuracy_score
                : null;
            
            // Process Topics into Clickable Badges
            const topicsRaw = row.analysis?.topics || [];
            let topicsHtml = '';
            if (topicsRaw.length > 0) {
                topicsHtml = '<div class="topic-container">' + 
                    topicsRaw.map(t => `<span class="topic-badge" onclick="scrollToTurn(event, ${index}, ${t.start_turn_index})">${t.topic_name}</span>`).join('') + 
                    '</div>';
            } else {
                topicsHtml = '<span style="color:var(--text-sub);">-</span>';
            }

            // Filtering logic
            if (currentFilter === 'Resolved' && outcome !== 'Resolved') return;
            if (currentFilter === 'Unresolved' && outcome !== 'Unresolved') return;
            if (currentFilter === 'quality-perfect' && qualityScore !== 5) return;

            if (search && !JSON.stringify(row).toLowerCase().includes(searchLower)) return;

            // Outcome badge
            const outcomeClass = outcome === 'Resolved'
                ? 'badge-resolved'
                : (outcome === 'Unresolved' ? 'badge-unresolved' : 'badge-neutral');

            // Quality badge
            let qualityHtml = '<span class="badge badge-gray">N/A</span>';
            if (qualityScore !== null) {
                let scoreClass = 'score-3';
                if (qualityScore >= 5) scoreClass = 'score-5';
                else if (qualityScore >= 4) scoreClass = 'score-4';
                else if (qualityScore >= 3) scoreClass = 'score-3';
                else if (qualityScore >= 2) scoreClass = 'score-2';
                else scoreClass = 'score-1';

                let emoji;
                if (qualityScore === 5) emoji = '🌟';      // perfect
                else if (qualityScore === 4) emoji = '🟡'; // minor issues
                else if (qualityScore === 3) emoji = '⚠️'; // noticeable issues
                else emoji = '❌';                         // poor

                qualityHtml = `<span class="quality-score ${scoreClass}">${emoji} ${qualityScore}/5</span>`;
            }

            const tr = document.createElement('tr');
            tr.id = `tr-${index}`;
            tr.innerHTML = `
                <td style="text-align:center; color: var(--text-sub); vertical-align: middle;">▼</td>
                <td><code>${convId.substring(0,6)}</code></td>
                <td><div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:400px; color: var(--text-sub)">${firstMsg}</div></td>
                <td><span class="badge ${outcomeClass}">${outcome}</span></td>
                <td>${qualityHtml}</td>
                <td><span class="badge badge-gray">${effort}</span></td>
                <td>${row.messages.length}</td>
                <td>${topicsHtml}</td>
            `;
            
            tr.onclick = () => toggleDetail(index, tr);
            tbody.appendChild(tr);

            const detailTr = document.createElement('tr');
            detailTr.innerHTML = `<td colspan="8" style="padding:0;"><div class="detail-view" id="detail-${index}"></div></td>`;
            tbody.appendChild(detailTr);
        });
    }

    function toggleDetail(index, tr) {
        const detailDiv = document.getElementById(`detail-${index}`);
        const isShown = detailDiv.style.display === 'block';
        
        // Close all others
        document.querySelectorAll('.detail-view').forEach(d => d.style.display = 'none');
        document.querySelectorAll('tr').forEach(r => r.classList.remove('expanded'));

        if (!isShown) {
            detailDiv.style.display = 'block';
            tr.classList.add('expanded');
            renderDetailView(index, detailDiv);
        }
    }

    function renderDetailView(index, container) {
        const conv = data[index];
        const analysis = conv.analysis || {};
        const metrics = analysis.metrics || {};
        const entities = metrics.entities || [];
        const perTurn = analysis.per_turn || [];
        const events = analysis.events || [];
        const goals = analysis.goals || {};
        const judge = conv.judge || {};

        // Sidebar - entities
        let entityHtml = '';
        if (entities.length > 0) {
            entities.forEach(e => {
                entityHtml += `
                    <div class="entity-tag">
                        <div class="entity-key">${e.type}</div>
                        <div class="entity-val">${e.value}</div>
                    </div>`;
            });
        } else {
            entityHtml = '<div style="color:var(--text-sub); font-style:italic;">No entities detected</div>';
        }

        // Cost breakdown
        const gptCost = conv["gpt5.1_cost"] || 0;
        const judgeCost = conv["gemini_judge_cost"] || 0;
        const totalCost = gptCost + judgeCost;

        // Judge quality explanation
        let qualityExplanation = '';
        if (typeof judge.accuracy_score === 'number' && judge.explanation) {
            let scoreEmoji;
            if (judge.accuracy_score === 5) scoreEmoji = '🌟';
            else if (judge.accuracy_score === 4) scoreEmoji = '🟡';
            else if (judge.accuracy_score === 3) scoreEmoji = '⚠️';
            else scoreEmoji = '❌';

            qualityExplanation = `
                <div class="quality-explanation">
                    <div class="quality-explanation-title">${scoreEmoji} Judge Assessment (Score: ${judge.accuracy_score}/5)</div>
                    <div>${judge.explanation}</div>
                </div>
            `;
        }
        
        // Flatten Goals for the timeline
        const turnGoals = [];
        if (goals.primary) {
             turnGoals.push({...goals.primary, type: 'primary'});
        }
        if (goals.secondary && Array.isArray(goals.secondary)) {
             goals.secondary.forEach(g => turnGoals.push({...g, type: 'secondary'}));
        }

        // Chat area with events and sentiments
        let chatHtml = qualityExplanation;
        conv.messages.forEach((msg, msgIndex) => {
            // Events tied to this turn
            const currentEvents = events.filter(e => e.turn_index === msgIndex);
            // Goals tied to this turn
            const currentGoals = turnGoals.filter(g => g.detection_turn === msgIndex);

            if (currentEvents.length > 0 || currentGoals.length > 0) {
                chatHtml += `<div class="timeline-event">`;
                
                // Render Goals
                currentGoals.forEach(g => {
                    chatHtml += `<span class="event-pill goal-${g.type}">🎯 ${g.label}</span>`;
                });

                // Render Events
                currentEvents.forEach(e => {
                    let pClass = 'neutral';
                    if (e.category === 'Issue') pClass = 'issue';
                    if (e.category === 'Win') pClass = 'win';
                    chatHtml += `<span class="event-pill ${pClass}">${e.name}</span>`;
                });
                
                chatHtml += `</div>`;
            }

            // Sentiment for user turns
            const turnAnalysis = perTurn.find(pt => pt.turn_index === msgIndex) || {};
            const sentiment = turnAnalysis.user_sentiment || 'Neutral';
            const isUser = msg.role === 'user';
            
            chatHtml += `
                <div class="message-row ${msg.role}" id="msg-${index}-${msgIndex}">
                    <div class="avatar ${msg.role}">${msg.role === 'user' ? 'U' : 'AI'}</div>
                    <div class="msg-bubble ${isUser ? 'sentiment-'+sentiment : ''}">
                        <div class="msg-meta">
                            <span>${msg.role}</span>
                            ${isUser ? `<span style="color:${getSentimentColor(sentiment)}">${sentiment}</span>` : ''}
                        </div>
                        <div>${msg.content}</div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = `
            <div class="detail-grid">
                <div class="detail-sidebar">
                    <div class="info-block">
                        <h4>Cost Breakdown</h4>
                        <div class="entity-tag">
                            <span class="entity-key">Analysis (gpt-5.1):</span> 
                            <span>$ ${gptCost.toFixed(4)}</span>
                        </div>
                        <div class="entity-tag">
                            <span class="entity-key">Judge (Gemini):</span> 
                            <span>$ ${judgeCost.toFixed(4)}</span>
                        </div>
                        <div class="entity-tag" style="background: var(--primary-light); border-color: var(--primary);">
                            <span class="entity-key">Total Cost:</span> 
                            <span style="font-weight: 700;">$ ${totalCost.toFixed(4)}</span>
                        </div>
                    </div>
                    <div class="info-block">
                        <h4>Entities Detected</h4>
                        ${entityHtml}
                    </div>
                    <div class="info-block">
                        <h4>Analysis Metrics</h4>
                        <div class="entity-tag">
                            <span class="entity-key">Containment:</span> 
                            <span>${metrics.containment ? 'True' : 'False'}</span>
                        </div>
                        <div class="entity-tag">
                            <span class="entity-key">Outcome Confidence:</span> 
                            <span>${metrics.outcome?.confidence || '-'}</span>
                        </div>
                    </div>
                </div>
                <div class="chat-area">
                    ${chatHtml}
                </div>
            </div>
        `;
    }

    function getSentimentColor(sent) {
        if (['Gratitude', 'Excitement', 'Trust'].includes(sent)) return '#059669';
        if (['Frustration', 'Confusion', 'Anger'].includes(sent)) return '#dc2626';
        if (['Curious', 'Informational'].includes(sent)) return '#2563eb';
        return '#9ca3af';
    }

    init();
</script>

</body>
</html>
